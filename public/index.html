<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hexo Admin</title>
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-slate-50 text-slate-800 h-screen overflow-hidden flex">
  <!-- Sidebar -->
  <aside class="w-80 bg-white border-r border-slate-200 flex flex-col h-full shrink-0">
    <div class="p-4 border-b border-slate-100">
      <h1 class="text-lg font-bold text-indigo-600 flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z" />
        </svg>
        Hexo Admin
      </h1>
      <p class="text-xs text-slate-400 mt-1" id="site-path">Loading...</p>
    </div>

    <div class="p-3 space-y-3">
      <div class="relative">
        <input id="search" type="text" placeholder="搜索文章..." class="w-full pl-9 pr-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 absolute left-3 top-2.5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      </div>
      <div class="flex gap-2">
        <select id="tag-filter" class="flex-1 text-xs border border-slate-200 rounded-lg px-2 py-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="">所有标签</option>
        </select>
        <select id="category-filter" class="flex-1 text-xs border border-slate-200 rounded-lg px-2 py-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="">所有分类</option>
        </select>
      </div>
      <button id="btn-new" class="w-full flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium py-2 rounded-lg transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
        </svg>
        新建文章
      </button>
    </div>

    <div id="post-list" class="flex-1 overflow-y-auto p-2 space-y-1">
      <!-- Posts injected here -->
    </div>

    <div id="pagination" class="p-3 border-t border-slate-100 flex items-center justify-between text-xs">
      <!-- Pagination injected here -->
    </div>
  </aside>

  <!-- Main editor -->
  <main class="flex-1 flex flex-col h-full min-w-0">
    <!-- Toolbar -->
    <header class="h-14 bg-white border-b border-slate-200 flex items-center justify-between px-4 shrink-0">
      <div class="flex items-center gap-2">
        <button id="btn-save" class="inline-flex items-center gap-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium px-4 py-1.5 rounded-lg transition">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" />
          </svg>
          保存
        </button>
        <button id="btn-delete" class="inline-flex items-center gap-1.5 bg-white border border-slate-200 hover:bg-red-50 hover:text-red-600 text-slate-600 text-sm font-medium px-3 py-1.5 rounded-lg transition">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
          </svg>
          删除
        </button>
        <span id="save-status" class="text-xs text-slate-400 ml-2"></span>
      </div>

      <div class="flex items-center gap-2">
        <button id="btn-publish" class="inline-flex items-center gap-1.5 bg-violet-600 hover:bg-violet-700 text-white text-sm font-medium px-4 py-1.5 rounded-lg transition">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.59 14.37a6 6 0 01-5.84 7.38v-4.8m5.84-2.58a14.98 14.98 0 006.16-12.12A14.98 14.98 0 009.631 8.41m5.96 5.96a14.926 14.926 0 01-5.841 2.58m-.119-8.54a6 6 0 00-7.381 5.84h4.8m2.581-5.84a14.927 14.927 0 00-2.58 5.84m2.699 2.7c-.103.021-.207.041-.311.06a15.09 15.09 0 01-2.448-2.448 14.9 14.9 0 01.06-.312m-2.24 2.39a4.493 4.493 0 00-1.757 4.306 4.493 4.493 0 004.306-1.758M16.5 9a1.5 1.5 0 11-3 0 1.5 1.5 0 013 0z" />
          </svg>
          一键发布
        </button>
        <div class="relative" id="hexo-menu-wrap">
          <button id="btn-hexo-menu" class="inline-flex items-center gap-1.5 bg-slate-800 hover:bg-slate-900 text-white text-sm font-medium px-4 py-1.5 rounded-lg transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
            </svg>
            Hexo 命令
            <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
          </button>
          <div id="hexo-menu" class="absolute right-0 mt-1 w-44 bg-white border border-slate-200 rounded-lg shadow-lg hidden z-20">
            <button data-cmd="generate" class="hexo-cmd w-full text-left px-4 py-2 text-sm hover:bg-slate-50 first:rounded-t-lg last:rounded-b-lg">hexo generate</button>
            <button data-cmd="deploy" class="hexo-cmd w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50">hexo deploy</button>
            <button data-cmd="clean" class="hexo-cmd w-full text-left px-4 py-2 text-sm hover:bg-slate-50">hexo clean</button>
          </div>
        </div>
      </div>
    </header>

    <!-- Front matter editor -->
    <div class="bg-white border-b border-slate-200 p-4 grid grid-cols-12 gap-4 shrink-0">
      <div class="col-span-12 lg:col-span-6">
        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">标题</label>
        <input id="fm-title" type="text" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>
      <div class="col-span-12 sm:col-span-6 lg:col-span-3">
        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">日期</label>
        <input id="fm-date" type="text" placeholder="2024-01-01 12:00:00" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>
      <div class="col-span-12 sm:col-span-6 lg:col-span-3">
        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Slug</label>
        <input id="fm-slug" type="text" readonly class="w-full border border-slate-200 bg-slate-50 rounded-lg px-3 py-2 text-sm text-slate-500" />
      </div>
      <div class="col-span-12 lg:col-span-6">
        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">标签</label>
        <div id="fm-tags" class="relative">
          <div id="fm-tags-box" class="w-full min-h-[38px] bg-white border border-slate-200 rounded-lg px-2 py-1 flex flex-wrap items-center gap-1 cursor-text focus-within:ring-2 focus-within:ring-indigo-500 focus-within:border-transparent">
            <input id="fm-tags-input" type="text" class="flex-1 min-w-[90px] px-1 py-0.5 text-sm outline-none" placeholder="输入以搜索或新建标签" />
          </div>
          <div id="fm-tags-dropdown" class="hidden absolute z-20 left-0 right-0 mt-1 bg-white border border-slate-200 rounded-lg shadow-lg max-h-48 overflow-auto text-sm"></div>
        </div>
      </div>
      <div class="col-span-12 lg:col-span-6">
        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">分类</label>
        <div id="fm-categories" class="relative">
          <div id="fm-categories-box" class="w-full min-h-[38px] bg-white border border-slate-200 rounded-lg px-2 py-1 flex flex-wrap items-center gap-1 cursor-text focus-within:ring-2 focus-within:ring-indigo-500 focus-within:border-transparent">
            <input id="fm-categories-input" type="text" class="flex-1 min-w-[90px] px-1 py-0.5 text-sm outline-none" placeholder="输入以搜索或新建分类" />
          </div>
          <div id="fm-categories-dropdown" class="hidden absolute z-20 left-0 right-0 mt-1 bg-white border border-slate-200 rounded-lg shadow-lg max-h-48 overflow-auto text-sm"></div>
        </div>
      </div>
    </div>

    <!-- Editor / Preview -->
    <div class="flex-1 flex min-h-0 relative">
      <div class="flex-1 flex flex-col border-r border-slate-200 min-w-0">
        <div class="bg-slate-100 text-xs font-medium text-slate-500 px-3 py-1.5 border-b border-slate-200 flex items-center justify-between">
          <span>Markdown</span>
          <span id="word-count" class="text-slate-400">0 字</span>
        </div>
        <textarea id="editor" class="flex-1 w-full p-4 font-mono text-sm leading-relaxed resize-none focus:outline-none" spellcheck="false"></textarea>
      </div>
      <div class="flex-1 flex flex-col min-w-0 bg-white">
        <div class="bg-slate-100 text-xs font-medium text-slate-500 px-3 py-1.5 border-b border-slate-200">预览</div>
        <div id="preview" class="flex-1 overflow-y-auto p-4 prose prose-slate max-w-none"></div>
      </div>
      <!-- Empty state overlay -->
      <div id="empty-state" class="absolute inset-0 bg-slate-50 flex flex-col items-center justify-center text-slate-400 z-10">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mb-4 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
        </svg>
        <p class="text-sm">从左侧选择一篇文章开始编辑</p>
        <p class="text-xs mt-1 text-slate-300">或点击「新建文章」创建新日志</p>
      </div>
    </div>
  </main>

  <!-- Command output modal -->
  <div id="cmd-modal" class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50">
    <div class="bg-white rounded-xl shadow-xl w-[800px] max-w-[90vw] max-h-[80vh] flex flex-col">
      <div class="flex items-center justify-between px-4 py-3 border-b border-slate-100">
        <h3 class="font-semibold text-slate-700" id="cmd-title">命令输出</h3>
        <button id="cmd-close" class="text-slate-400 hover:text-slate-600">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      <pre id="cmd-output" class="flex-1 overflow-auto p-4 text-xs font-mono bg-slate-900 text-slate-100 m-0 rounded-b-xl"></pre>
    </div>
  </div>

  <!-- New post modal -->
  <div id="new-modal" class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50">
    <div class="bg-white rounded-xl shadow-xl w-[480px] max-w-[90vw] p-6">
      <h3 class="font-semibold text-slate-700 mb-4">新建文章</h3>
      <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">标题</label>
      <input id="new-title" type="text" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm mb-4 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="输入标题" />
      <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Slug（可选）</label>
      <input id="new-slug" type="text" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm mb-4 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="留空则根据标题生成，即文件名/URL" />
      <div class="flex justify-end gap-2">
        <button id="new-cancel" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg transition">取消</button>
        <button id="new-confirm" class="px-4 py-2 text-sm bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg transition">创建</button>
      </div>
    </div>
  </div>

  <!-- Auth overlay (shown when Clerk auth is enabled and not signed in) -->
  <div id="auth-overlay" class="fixed inset-0 bg-slate-50 hidden flex-col items-center justify-center z-50">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mb-4 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z" />
    </svg>
    <h1 class="text-xl font-bold text-indigo-600 mb-2">Hexo Admin</h1>
    <p id="auth-hint" class="text-sm text-slate-500 mb-6">需要登录后才能继续</p>
    <button id="btn-sign-in" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-6 py-2 rounded-lg transition">登录</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
